<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="og-title og-desc"
>
  <!--
    Default Open Graph / Twitter share card (docs/redesign/brand-elevation-phase.md
    §2/§4c). Source of record for /og/og-default.png, which is what every
    social platform actually fetches (SVG og:image support is inconsistent,
    so this file is the design source + a directly-viewable original, not
    the shared artifact itself).

    Self-hosted, self-contained: the @font-face below points at this
    project's own /fonts/*.woff2 (same files apps/web/src/styles/base.css
    already serves), so this SVG renders correctly even opened on its own,
    same-origin, no CDN. Colors are the light-theme token values from
    apps/web/src/styles/base.css's `[data-theme='light']` block, hard-coded
    (a standalone /public SVG has no CSS custom property context to
    inherit from) — kept in sync by hand; if those tokens move, update here.

    Content: wordmark, the one-line brand promise, the actual meta
    description sub-line, and a static frame of the homepage hero's
    decision engine (src/components/hero/DecisionEngine.tsx, first
    scene): the same illustrative tender, the eight published components
    with the points they earned (they sum to the 84 shown, as the hero's
    unit test enforces), and the Strong match band. Labelled illustrative
    in the image, same rule as the hero.
  -->
  <title id="og-title">BidMorrow: Find the tenders worth pursuing. Skip the rest.</title>
  <desc id="og-desc">
    Bid/no-bid qualification for EU public procurement, TED. An illustrative notice is scored
    on eight components to 84 of 100 and placed in the Strong match band.
  </desc>

  <style>
    @font-face {
      font-family: 'Archivo';
      src: url('/fonts/archivo-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-display: block;
    }
    @font-face {
      font-family: 'Source Code Pro';
      src: url('/fonts/source-code-pro-latin.woff2') format('woff2');
      font-weight: 200 900;
      font-display: block;
    }
    text {
      font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .mono {
      font-family: 'Source Code Pro', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas,
        monospace;
    }
  </style>

  <rect width="1200" height="630" fill="#f7f8f9" />

  <!-- brand -->
  <g transform="translate(40, 78)">
    <rect x="13" y="0" width="26" height="11" rx="5.5" fill="#14181d" opacity="0.28" />
    <rect x="8" y="14" width="36" height="11" rx="5.5" fill="#14181d" opacity="0.5" />
    <rect x="3" y="28" width="46" height="12" rx="6" fill="#0f7d6f" />
    <text x="62" y="30" font-size="25" font-weight="600" fill="#14181d" letter-spacing="-0.01em">
      BidMorrow
    </text>
  </g>

  <!-- headline -->
  <g font-weight="700" fill="#14181d" letter-spacing="-0.02em">
    <text x="40" y="220" font-size="60">Find the tenders</text>
    <text x="40" y="288" font-size="60">worth pursuing.</text>
    <text x="40" y="356" font-size="60">Skip the rest.</text>
  </g>

  <!-- sub-line: real page copy, not invented for this image -->
  <g font-size="22" fill="#4d5661">
    <text x="40" y="404">Bid/no-bid qualification for EU public</text>
    <text x="40" y="434">procurement &#183; TED</text>
  </g>

  <!-- decision engine panel: a static frame of the homepage hero
       (src/components/hero/DecisionEngine.tsx, first scene). Same
       illustrative tender, same eight components, same 84 / 100. -->
  <g>
    <rect
      x="720"
      y="95"
      width="440"
      height="410"
      rx="20"
      fill="#ffffff"
      stroke="#e6e9ec"
      stroke-width="1.5"
    />

    <!-- source line + queue -->
    <text x="744" y="124" class="mono" font-size="10" letter-spacing="0.08em" fill="#5f6875">
      TED · OJ S · EVERY MORNING
    </text>
    <g fill="none" stroke="#14181d" stroke-opacity="0.35" stroke-width="1.5">
      <rect x="1080" y="114" width="16" height="10" rx="2" />
      <rect x="1102" y="114" width="16" height="10" rx="2" />
      <rect x="1124" y="114" width="16" height="10" rx="2" />
    </g>

    <!-- the notice, as the feed card shows it -->
    <rect x="736" y="138" width="408" height="100" rx="10" fill="#ffffff" stroke="#d5dae0" stroke-width="1.5" />
    <text x="752" y="160" class="mono" font-size="10" letter-spacing="0.04em" fill="#5f6875">
      NATIONAL HEALTH MINISTRY · CY
    </text>
    <text x="752" y="181" font-size="14" font-weight="600" fill="#14181d">
      Cloud migration and managed hosting
    </text>
    <text x="752" y="199" font-size="14" font-weight="600" fill="#14181d">
      for national health records
    </text>
    <text x="752" y="220" class="mono" font-size="11" fill="#4d5661">
      €1.84M · closes in 11 days
    </text>

    <!-- pipeline -->
    <line x1="940" y1="238" x2="940" y2="258" stroke="#d5dae0" stroke-width="2" stroke-linecap="round" />
    <circle cx="940" cy="248" r="3.5" fill="#0f7d6f" />

    <!-- the engine -->
    <rect
      x="736"
      y="258"
      width="408"
      height="196"
      rx="10"
      fill="#ffffff"
      stroke="rgba(15,125,111,0.28)"
      stroke-width="1.5"
    />
    <text x="752" y="278" font-size="11" font-weight="600" fill="#14181d">BidMorrow qualification</text>
    <text x="1130" y="278" class="mono" font-size="9" letter-spacing="0.06em" text-anchor="end" fill="#5f6875">
      ENGINE V1
    </text>
    <line x1="752" y1="287" x2="1130" y2="287" stroke="#eef0f2" stroke-width="1" />
      <g>
        <path d="M750.0 301.0 l2.6 2.6 l5.4 -6" fill="none" stroke="#0f7d6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="768" y="304" font-size="10.5" fill="#14181d">CPV fit</text>
        <text x="1130" y="304" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">32/35</text>
      </g>
      <g>
        <path d="M750.0 316.0 l2.6 2.6 l5.4 -6" fill="none" stroke="#0f7d6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="768" y="319" font-size="10.5" fill="#14181d">Capability &amp; keyword fit</text>
        <text x="1130" y="319" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">18/20</text>
      </g>
      <g>
        <path d="M750.0 331.0 l2.6 2.6 l5.4 -6" fill="none" stroke="#0f7d6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="768" y="334" font-size="10.5" fill="#14181d">Geography</text>
        <text x="1130" y="334" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">14/15</text>
      </g>
      <g>
        <path d="M750.0 346.0 l2.6 2.6 l5.4 -6" fill="none" stroke="#0f7d6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="768" y="349" font-size="10.5" fill="#14181d">Contract value</text>
        <text x="1130" y="349" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">9/10</text>
      </g>
      <g>
        <path d="M750.0 361.0 l2.6 2.6 l5.4 -6" fill="none" stroke="#0f7d6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        <text x="768" y="364" font-size="10.5" fill="#14181d">Buyer &amp; sector</text>
        <text x="1130" y="364" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">4/5</text>
      </g>
      <g>
        <circle cx="754" cy="375.5" r="4.2" fill="none" stroke="#0f7d6f" stroke-width="1.4" /><path d="M754 371.3 a4.2 4.2 0 0 1 0 8.4 Z" fill="#0f7d6f" />
        <text x="768" y="379" font-size="10.5" fill="#14181d">Procedure &amp; contract nature</text>
        <text x="1130" y="379" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">3/5</text>
      </g>
      <g>
        <circle cx="754" cy="390.5" r="4.2" fill="none" stroke="#0f7d6f" stroke-width="1.4" /><path d="M754 386.3 a4.2 4.2 0 0 1 0 8.4 Z" fill="#0f7d6f" />
        <text x="768" y="394" font-size="10.5" fill="#14181d">Deadline runway</text>
        <text x="1130" y="394" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">2/5</text>
      </g>
      <g>
        <circle cx="754" cy="405.5" r="4.2" fill="none" stroke="#0f7d6f" stroke-width="1.4" /><path d="M754 401.3 a4.2 4.2 0 0 1 0 8.4 Z" fill="#0f7d6f" />
        <text x="768" y="409" font-size="10.5" fill="#14181d">Eligibility &amp; certifications</text>
        <text x="1130" y="409" class="mono" font-size="10.5" text-anchor="end" fill="#4d5661">2/5</text>
      </g>
    <line x1="752" y1="418" x2="1130" y2="418" stroke="#eef0f2" stroke-width="1" />

    <!-- score -->
    <g transform="translate(768, 437)">
      <circle r="14" fill="none" stroke="#e6e9ec" stroke-width="3.5" />
      <circle
        r="14"
        fill="none"
        stroke="#0f7d6f"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-dasharray="73.89 87.96"
        transform="rotate(-90)"
      />
    </g>
    <text x="792" y="445" class="mono" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="#14181d">84</text>
    <text x="824" y="445" class="mono" font-size="11" fill="#5f6875">/ 100</text>
    <rect x="1030" y="425" width="100" height="24" rx="12" fill="#0f7d6f" />
    <text x="1080" y="441" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">
      Strong match
    </text>

    <text
      x="940"
      y="486"
      class="mono"
      text-anchor="middle"
      font-size="10"
      letter-spacing="0.08em"
      fill="#5f6875"
    >
      ILLUSTRATIVE EXAMPLE · NOT LIVE DATA
    </text>
  </g>
</svg>
