# Deploys the dedicated www -> apex redirect worker (apps/www-redirect,
# HUMAN_DECISION_BLOCKERS item 12). First deploy attaches www.bidmorrow.com
# as a Workers custom domain — wrangler creates the zone DNS record and
# certificate itself, the same mechanism that attached the apex and staging
# domains. Production-zone change, so it carries the same typed-confirmation
# gate as deploy-production and only runs on explicit owner instruction.
name: Deploy www redirect

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-www-redirect" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-www-redirect
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "deploy-www-redirect" ] || { echo 'refusing: confirm input must be exactly "deploy-www-redirect"'; exit 1; }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        working-directory: apps/www-redirect
        run: pnpm exec wrangler deploy

      - name: Smoke test — www 301s to apex, preserving path and query
        run: |
          # Custom-domain DNS + certificate provisioning can take a minute
          # on first deploy; read status/location per attempt instead of a
          # blind curl -sf.
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            hdrs=$(curl -s -o /dev/null -D - --max-time 15 "https://www.bidmorrow.com/pricing?x=1" 2>/dev/null || true)
            code=$(printf '%s' "$hdrs" | head -1 | awk '{print $2}')
            loc=$(printf '%s' "$hdrs" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            echo "attempt $i: status=${code:-connection-error} location=${loc:-none}"
            if [ "$code" = "301" ] && [ "$loc" = "https://bidmorrow.com/pricing?x=1" ]; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "www redirect smoke test failed"; exit 1; }
          # Root path too
          loc=$(curl -s -o /dev/null -D - --max-time 15 "https://www.bidmorrow.com/" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ "$loc" = "https://bidmorrow.com/" ] || { echo "root redirect wrong: $loc"; exit 1; }
          echo "www redirect smoke tests passed"
