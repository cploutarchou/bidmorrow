# Nightly Playwright E2E run (Phase 12 stage B decision, documented in
# docs/phase12-quality-findings.md §3): a scheduled run of the full suite,
# alerting on a break independently of pull-request traffic. The job itself
# lives in e2e-suite.yml, shared with the per-pull-request run added on
# 2026-09-03 (e2e-pr.yml).
name: E2E (nightly)

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {} # manual trigger for pre-release verification

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e-suite.yml
