# Fixture raw-material fetch (ted-fixture-refresh skill, Phase 13 gate 3):
# downloads recent REAL competition notices from the TED Search API (the
# session sandbox cannot reach ted.europa.eu — CI can) and force-pushes them
# to the scratch branch `ted-fixture-raw`. The branch is transient raw
# material: fixtures are sanitized + labeled from it by hand into
# tests/fixtures/ted/ (see the skill), and the branch is deleted afterwards.
# TED notices are public documents; the raw branch never touches main.
name: TED fixture fetch

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Publication window: days back from today (1-30)'
        required: false
        type: string
        default: '5'
      max_notices:
        description: 'Max notices to download (1-100)'
        required: false
        type: string
        default: '40'
      cpv_prefixes:
        description: 'Optional CPV prefix filter, comma-separated (e.g. 72,48,79417000). Empty = no CPV filter.'
        required: false
        type: string
        default: ''
      delete_raw_branch:
        description: 'Cleanup mode: delete the ted-fixture-raw scratch branch instead of fetching. Use once the fixtures have been sanitized and committed.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ted-fixture-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAYS_BACK: ${{ inputs.days_back }}
      MAX_NOTICES: ${{ inputs.max_notices }}
      CPV_PREFIXES: ${{ inputs.cpv_prefixes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Delete the ted-fixture-raw scratch branch (cleanup mode)
        if: ${{ inputs.delete_raw_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The branch is transient raw material by design (see header) and
          # holds unsanitized real notices, so deleting it promptly matters.
          # This mode exists because session credentials are scoped to the
          # working branch and cannot delete refs — CI's token can.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete ted-fixture-raw
          echo "deleted branch ted-fixture-raw"

      - name: Validate inputs (defense in depth)
        if: ${{ !inputs.delete_raw_branch }}
        run: |
          echo "$DAYS_BACK" | grep -Eq '^[0-9]{1,2}$' || { echo "bad days_back"; exit 1; }
          echo "$MAX_NOTICES" | grep -Eq '^[0-9]{1,3}$' || { echo "bad max_notices"; exit 1; }
          echo "$CPV_PREFIXES" | grep -Eq '^([0-9]{2,8}(,[0-9]{2,8})*)?$' || { echo "bad cpv_prefixes"; exit 1; }

      - name: Fetch raw notices from the TED Search API
        if: ${{ !inputs.delete_raw_branch }}
        run: node scripts/fetch-raw-ted-notices.mjs

      - name: Push raw material to the ted-fixture-raw scratch branch
        if: ${{ !inputs.delete_raw_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd raw-fixtures
          git init -b ted-fixture-raw
          git config user.name "bidmorrow-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "raw TED notices for fixture refresh ($(date -u +%FT%TZ))"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ted-fixture-raw
          echo "pushed $(git ls-files raw/ | grep -c '\.xml$') XMLs to branch ted-fixture-raw"
