# Production deploy (docs/deployment.md "CI/CD flow" step 3): DISPATCH-ONLY.
# GitHub Required reviewers need Enterprise on private repos, so the gate is:
# `production` environment restricted to protected branches only + the typed
# `confirm` input validated as the first step below + the convention that no
# automated agent dispatches this without explicit owner instruction
# (HUMAN_DECISION_BLOCKERS item 8.2; accepted residual in threat-model §5).
# Reads deploy credentials + runtime secrets from that environment. Never
# triggered by pushes.
#
# First deploy bootstraps everything: queues + R2 bucket + the D1 database
# are created idempotently, the resolved D1 id is patched into the checkout's
# wrangler.jsonc (the repo carries a placeholder until the printed
# PRODUCTION_D1_ID is committed), and `wrangler deploy --env production`
# attaches bidmorrow.com as a custom domain automatically (routes +
# workers_dev:false in wrangler.jsonc). Production comes up with
# ingestion_paused=true — unpausing is a deliberate go-live step.
#
# Per docs/deployment.md, a D1 Time Travel bookmark is captured and printed
# before migrations run — the run log is the deploy record.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        # Environment "Required reviewers" needs GitHub Enterprise on
        # private repos (discovered 2026-08-16, owner is on Pro), so the
        # human gate is this typed confirmation + the environment's
        # "Protected branches only" policy (main is ruleset-protected)
        # + the standing convention that the assistant never dispatches a
        # production deploy without an explicit owner instruction.
        description: 'Type "deploy-production" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "deploy-production" ] || { echo 'refusing: confirm input must be exactly "deploy-production"'; exit 1; }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure queues exist (idempotent)
        working-directory: apps/worker
        run: |
          for q in bidmorrow-ingest-production bidmorrow-match-production bidmorrow-digest-production \
                   bidmorrow-ingest-dlq-production bidmorrow-match-dlq-production bidmorrow-digest-dlq-production; do
            out=$(pnpm exec wrangler queues create "$q" 2>&1) && echo "created $q" || {
              if echo "$out" | grep -qi 'already exists\|already taken\|duplicate\|11009'; then
                echo "$q already exists"
              else
                echo "$out"; exit 1
              fi
            }
          done

      - name: Ensure R2 snapshots bucket exists (idempotent)
        working-directory: apps/worker
        run: |
          out=$(pnpm exec wrangler r2 bucket create bidmorrow-snapshots-production 2>&1) && echo "created bucket" || {
            if echo "$out" | grep -qi 'already exists\|already owns'; then
              echo "bucket already exists"
            else
              echo "$out"; exit 1
            fi
          }

      - name: Ensure D1 database exists (idempotent)
        working-directory: apps/worker
        run: |
          out=$(pnpm exec wrangler d1 create bidmorrow-production --location weur 2>&1) && echo "created bidmorrow-production" || {
            if echo "$out" | grep -qi 'already exists\|already.*taken\|duplicate'; then
              echo "bidmorrow-production already exists"
            else
              echo "$out"; exit 1
            fi
          }

      - name: Resolve D1 id and patch config
        working-directory: apps/worker
        run: |
          id=$(pnpm exec wrangler d1 info bidmorrow-production --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const id=j.uuid||j.id;if(!id){console.error("no uuid in d1 info output");process.exit(1)}console.log(id)})')
          # Printed so the real id can be committed into wrangler.jsonc after
          # the first deploy (replacing the placeholder for good).
          echo "PRODUCTION_D1_ID=$id"
          node -e '
            const fs = require("fs");
            const p = "wrangler.jsonc";
            const id = process.argv[1];
            let s = fs.readFileSync(p, "utf8");
            if (s.includes("production-placeholder")) {
              fs.writeFileSync(p, s.replace("production-placeholder", id));
              console.log("patched wrangler.jsonc with resolved production D1 id");
            } else if (!s.includes(id)) {
              console.error("wrangler.jsonc carries a production database_id that does not match the bidmorrow-production database on this account — refusing to deploy against the wrong database");
              process.exit(1);
            } else {
              console.log("wrangler.jsonc already carries the resolved production D1 id");
            }
          ' "$id"

      - name: Capture D1 Time Travel bookmark (pre-migration restore point)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 time-travel info bidmorrow-production --env production --json

      - name: Apply D1 migrations (remote)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply bidmorrow-production --env production --remote

      - name: Verify foreign key enforcement on the live database (P10-R-04)
        # docs/data-model.md relies on FK enforcement being ON in D1. Verify
        # it against the real database at every deploy instead of trusting
        # platform defaults (verified queryable on remote D1, 2026-08-16).
        working-directory: apps/worker
        run: |
          pnpm exec wrangler d1 execute bidmorrow-production --env production --remote --command "PRAGMA foreign_keys" --json \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const v=j[0]?.results?.[0]?.foreign_keys;if(v!==1){console.error("PRAGMA foreign_keys returned",JSON.stringify(v),"— foreign key enforcement is OFF on the live database");process.exit(1)}console.log("foreign_keys=1 (enforced)")})'

      - name: Seed ingestion_paused flag (first-deploy safety, idempotent)
        # Production comes up paused; unpausing is a deliberate go-live step
        # after the production readiness checks (docs/production-checklist.md).
        working-directory: apps/worker
        run: |
          pnpm exec wrangler d1 execute bidmorrow-production --env production --remote --command "INSERT INTO feature_flags (id, key, value_json, description, created_at, updated_at) SELECT lower(hex(randomblob(13))), 'ingestion_paused', 'true', 'Seeded at first production deploy: unpause deliberately at go-live.', CAST(strftime('%s','now') AS INTEGER)*1000, CAST(strftime('%s','now') AS INTEGER)*1000 WHERE NOT EXISTS (SELECT 1 FROM feature_flags WHERE key = 'ingestion_paused')"

      - name: Build web SPA
        run: pnpm --filter @bidmorrow/web build

      - name: Deploy Worker (production)
        # No --var overrides: env.production vars already carry the canonical
        # https://bidmorrow.com URLs, and the deploy attaches the custom
        # domain (creating DNS record + certificate) on first run.
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env production

      - name: Push runtime secrets
        working-directory: apps/worker
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          PADDLE_PRICE_FOUNDING_MONTHLY: ${{ secrets.PADDLE_PRICE_FOUNDING_MONTHLY }}
          PADDLE_PRICE_STANDARD_MONTHLY: ${{ secrets.PADDLE_PRICE_STANDARD_MONTHLY }}
          # Public by design (Paddle.js client token) but environment-scoped
          # like every other billing name, so they travel with the secrets.
          PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          PADDLE_ENVIRONMENT: ${{ vars.PADDLE_ENVIRONMENT }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          # Only non-empty values are pushed; absent optionals stay unset so
          # the app's documented fallbacks engage instead of empty strings.
          # Production MUST use live Paddle credentials (pdl_live_…, live_… token, PADDLE_ENVIRONMENT=production) — never staging's test
          # keys (docs/deployment.md environment rules).
          node -e '
            const keys = ["BETTER_AUTH_SECRET","RESEND_API_KEY","PADDLE_API_KEY","PADDLE_WEBHOOK_SECRET","PADDLE_PRICE_FOUNDING_MONTHLY","PADDLE_PRICE_STANDARD_MONTHLY","PADDLE_CLIENT_TOKEN","PADDLE_ENVIRONMENT","ADMIN_EMAILS","EMAIL_FROM"];
            const out = {};
            for (const k of keys) { const v = process.env[k]; if (v !== undefined && v !== "") out[k] = v; }
            if (out.BETTER_AUTH_SECRET === undefined) { console.error("BETTER_AUTH_SECRET missing in the production environment secrets"); process.exit(1); }
            require("fs").writeFileSync(".secrets.tmp.json", JSON.stringify(out));
            console.log("pushing secrets:", Object.keys(out).join(", "));
          '
          pnpm exec wrangler secret bulk .secrets.tmp.json --env production
          rm -f .secrets.tmp.json

      - name: Smoke tests
        run: |
          base='https://bidmorrow.com'
          echo "smoke: $base"
          # First deploy: DNS record + certificate for the custom domain are
          # provisioned during the deploy — allow up to ~2 minutes. Each
          # attempt prints status + body head so a failure is diagnosable
          # from the log instead of a blind curl -sf.
          ok=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/health.out -w '%{http_code}' --max-time 15 "$base/api/health/live" 2>/dev/null || true)
            if [ "$code" = "200" ] && grep -q '"ok"' /tmp/health.out; then ok=1; break; fi
            echo "attempt $i: status=${code:-connection-error} body=$(head -c 200 /tmp/health.out 2>/dev/null | tr -d '\n')"
            sleep 10
          done
          [ -n "$ok" ] || {
            echo "production health check failed — verbose diagnostics follow:"
            curl -v --max-time 20 "$base/api/health/live" 2>&1 | tail -50 || true
            exit 1
          }
          curl -sf "$base/api/health/ready" | grep -q '"ok"'
          curl -sfI "$base/" | grep -qi 'content-security-policy'
          # E2E test hooks MUST be dead on production (double gate).
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/test/mailbox")
          test "$code" = "404"
          curl -s "$base/api/definitely-not-a-route" | grep -q 'not_found'
          # robots.txt is Worker-served and branches on APP_ENV, which is an
          # untyped string: a missing or mis-cased value would silently serve
          # the non-production body — a blanket `Disallow: /` — and deindex the
          # live site. Assert the production body here, where it is cheap to
          # catch, rather than discovering it in Search Console weeks later.
          # This zone has Cloudflare's managed robots.txt on: it prepends a
          # block (between "# BEGIN/END Cloudflare Managed Content" markers)
          # with per-AI-bot `Disallow: /` lines. Those are not ours and not a
          # blanket block — strip the block so only the Worker's body is
          # asserted (first seen: deploy run 33318306885, 2026-08-30).
          robots=$(curl -sf "$base/robots.txt" | awk 'BEGIN{skip=0}
            /^# BEGIN Cloudflare Managed [Cc]ontent/{skip=1; next}
            /^# END Cloudflare Managed [Cc]ontent/{skip=0; next}
            !skip')
          echo "$robots" | grep -q 'Sitemap: https://bidmorrow.com/sitemap.xml' || {
            echo "robots.txt is not serving the production body:"; echo "$robots"; exit 1; }
          echo "$robots" | grep -qx 'Disallow: /' && {
            echo "robots.txt is blanket-disallowing production:"; echo "$robots"; exit 1; }
          curl -sf "$base/sitemap.xml" | grep -q '<loc>https://bidmorrow.com/</loc>'
          echo "production smoke tests passed"
