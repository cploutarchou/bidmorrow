name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token: gitleaks-action needs to read PR commits on
# pull_request events; nothing in CI ever writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so history-aware tooling (e.g. gitleaks) behaves identically here.
          fetch-depth: 0

      - name: Set up pnpm
        # Version is resolved from the "packageManager" field in package.json — do not hardcode.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # Verifies the web and worker bundles compile. CI never deploys —
        # deployment is a separate, explicitly-invoked concern.
        run: pnpm build

      - name: Verify build artifacts
        # F-11: the _headers verbatim-copy assertion in
        # tests/security/static-asset-headers.test.ts is guarded "when one
        # exists", and Test runs before Build on a clean checkout — so it
        # never fired in CI. This step is that assertion, placed where dist/
        # actually exists.
        run: pnpm verify:build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans the full git history, so it needs all commits.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is intentionally not set: it is only required for
          # organization-owned repos; individual/free usage needs no license key.
