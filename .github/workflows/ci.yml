name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token: gitleaks-action needs to read PR commits on
# pull_request events; nothing in CI ever writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so history-aware tooling (e.g. gitleaks) behaves identically here.
          fetch-depth: 0

      - name: Set up pnpm
        # Version is resolved from the "packageManager" field in package.json — do not hardcode.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # Verifies the web and worker bundles compile. CI never deploys —
        # deployment is a separate, explicitly-invoked concern.
        run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the full git history, so it needs all commits.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is intentionally not set: it is only required for
          # organization-owned repos; individual/free usage needs no license key.
