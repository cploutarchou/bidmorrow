# Staging deploy (Phase 13, docs/deployment.md "CI/CD flow" step 2):
# auto-deploys every merge to main, plus manual workflow_dispatch re-runs.
# Reads deploy credentials + runtime secrets from the GitHub `staging`
# ENVIRONMENT (not repository secrets) — the owner stored them there.
#
# Steps mirror docs/deployment.md exactly: ensure resources (idempotent) →
# remote migrations → seed ingestion_paused (pre-first-ingestion gates) →
# deploy → push runtime secrets → smoke tests. The workers.dev URL is
# computed from the account's subdomain and injected via --var, overriding
# the placeholder staging URLs in wrangler.jsonc until a custom domain
# exists.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure queues exist (idempotent)
        working-directory: apps/worker
        run: |
          for q in bidmorrow-ingest-staging bidmorrow-match-staging bidmorrow-digest-staging \
                   bidmorrow-ingest-dlq-staging bidmorrow-match-dlq-staging bidmorrow-digest-dlq-staging; do
            out=$(pnpm exec wrangler queues create "$q" 2>&1) && echo "created $q" || {
              if echo "$out" | grep -qi 'already exists\|already been taken\|duplicate'; then
                echo "$q already exists"
              else
                echo "$out"; exit 1
              fi
            }
          done

      - name: Ensure R2 snapshots bucket exists (idempotent)
        working-directory: apps/worker
        run: |
          out=$(pnpm exec wrangler r2 bucket create bidmorrow-snapshots-staging 2>&1) && echo "created bucket" || {
            if echo "$out" | grep -qi 'already exists\|already owns'; then
              echo "bucket already exists"
            else
              echo "$out"
              echo "::error::R2 bucket creation failed. If the message says R2 must be enabled, enable it once in the Cloudflare Dashboard (R2 → Enable), then re-run this workflow."
              exit 1
            fi
          }

      - name: Apply D1 migrations (remote)
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply bidmorrow-staging --env staging --remote

      - name: Seed ingestion_paused flag (first-deploy safety, idempotent)
        # Pre-first-ingestion gates (docs/deployment.md) must pass before the
        # ingestion cron may run a real TED window — staging comes up paused;
        # an admin unpauses via the flags endpoint once the gates are closed.
        working-directory: apps/worker
        run: |
          pnpm exec wrangler d1 execute bidmorrow-staging --env staging --remote --command "INSERT INTO feature_flags (id, key, value_json, description, created_at, updated_at) SELECT lower(hex(randomblob(13))), 'ingestion_paused', 'true', 'Seeded at first staging deploy: pre-first-ingestion gates (docs/deployment.md) must pass before unpausing.', CAST(strftime('%s','now') AS INTEGER)*1000, CAST(strftime('%s','now') AS INTEGER)*1000 WHERE NOT EXISTS (SELECT 1 FROM feature_flags WHERE key = 'ingestion_paused')"

      - name: Build web SPA
        run: pnpm --filter @bidmorrow/web build

      - name: Resolve workers.dev URL
        id: url
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);if(!j.result||!j.result.subdomain){console.error("no workers.dev subdomain registered — set one in Dashboard → Workers & Pages");process.exit(1)}console.log(j.result.subdomain)})')
          echo "base=https://bidmorrow-staging.${sub}.workers.dev" >> "$GITHUB_OUTPUT"
          echo "Staging URL will be: https://bidmorrow-staging.${sub}.workers.dev"

      - name: Deploy Worker (staging)
        working-directory: apps/worker
        run: |
          pnpm exec wrangler deploy --env staging \
            --var APP_BASE_URL:${{ steps.url.outputs.base }} \
            --var BETTER_AUTH_URL:${{ steps.url.outputs.base }}

      - name: Push runtime secrets
        working-directory: apps/worker
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_FOUNDING_MONTHLY: ${{ secrets.STRIPE_PRICE_FOUNDING_MONTHLY }}
          STRIPE_PRICE_STANDARD_MONTHLY: ${{ secrets.STRIPE_PRICE_STANDARD_MONTHLY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          # Only non-empty values are pushed; absent optionals (e.g.
          # STRIPE_WEBHOOK_SECRET before the webhook exists, EMAIL_FROM before
          # Resend domain verification) stay unset so the app's documented
          # fallbacks engage instead of receiving empty strings.
          node -e '
            const keys = ["BETTER_AUTH_SECRET","RESEND_API_KEY","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","STRIPE_PRICE_FOUNDING_MONTHLY","STRIPE_PRICE_STANDARD_MONTHLY","ADMIN_EMAILS","EMAIL_FROM"];
            const out = {};
            for (const k of keys) { const v = process.env[k]; if (v !== undefined && v !== "") out[k] = v; }
            if (out.BETTER_AUTH_SECRET === undefined) { console.error("BETTER_AUTH_SECRET missing in the staging environment secrets"); process.exit(1); }
            require("fs").writeFileSync(".secrets.tmp.json", JSON.stringify(out));
            console.log("pushing secrets:", Object.keys(out).join(", "));
          '
          pnpm exec wrangler secret bulk .secrets.tmp.json --env staging
          rm -f .secrets.tmp.json

      - name: Smoke tests
        run: |
          base='${{ steps.url.outputs.base }}'
          echo "smoke: $base"
          # Worker liveness + readiness (readiness checks the DB binding).
          curl -sf "$base/api/health/live" | grep -q '"ok"'
          curl -sf "$base/api/health/ready" | grep -q '"ok"'
          # SPA serves with the security headers from public/_headers.
          curl -sfI "$base/" | grep -qi 'content-security-policy'
          # E2E test hooks MUST be dead on staging (double gate).
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/test/mailbox")
          test "$code" = "404"
          # Unknown API routes 404 with the JSON envelope.
          curl -s "$base/api/definitely-not-a-route" | grep -q 'not_found'
          echo "smoke tests passed"
