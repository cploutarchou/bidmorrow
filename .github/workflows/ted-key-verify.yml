# TED API key verification (HUMAN_DECISION_BLOCKERS item 9): once the owner
# stores TED_API_KEY in the `staging` GitHub environment, this dispatchable
# workflow verifies — against the live authenticated endpoint — which
# Authorization header shape the TED API accepts, BEFORE the key is used by
# any deploy (verify-current-docs discipline: never trust memory for external
# API syntax). Prints statuses and byte counts ONLY; the key itself is never
# echoed. Two GET requests total against one already-published notice.
name: TED key verify

on:
  workflow_dispatch:
    inputs:
      publication_number:
        description: 'Publication number to fetch (e.g. 566510-2026)'
        required: false
        type: string
        default: '566510-2026'

permissions:
  contents: read

concurrency:
  group: ted-key-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      TED_API_KEY: ${{ secrets.TED_API_KEY }}
      PUB_NUM: ${{ inputs.publication_number }}
    steps:
      - name: Validate inputs (defense in depth)
        run: |
          echo "$PUB_NUM" | grep -Eq '^[0-9]{1,8}-[0-9]{4}$' || { echo "bad publication_number"; exit 1; }
          [ -n "$TED_API_KEY" ] || { echo "TED_API_KEY is not set in the staging environment — add it first (HUMAN_DECISION_BLOCKERS item 9)"; exit 1; }

      - name: Probe Authorization header shapes
        run: |
          url="https://api.ted.europa.eu/v3/notices/${PUB_NUM}/xml"
          echo "target: $url"
          for shape in bearer raw; do
            if [ "$shape" = "bearer" ]; then auth="Bearer ${TED_API_KEY}"; else auth="${TED_API_KEY}"; fi
            out=$(curl -s -o /tmp/body.out -w '%{http_code}' --max-time 30 \
              -H "Authorization: ${auth}" \
              -H 'Accept: application/xml, text/xml;q=0.9, */*;q=0.5' \
              -H 'User-Agent: BidMorrow/1.0 (+https://bidmorrow.com; support@bidmorrow.com)' \
              "$url" || echo 'curl-error')
            bytes=$(wc -c < /tmp/body.out | tr -d ' ')
            head=$(head -c 60 /tmp/body.out | tr -d '\n' | tr -c 'a-zA-Z0-9<>?/=". :-' '_')
            echo "shape=${shape}: status=${out} bytes=${bytes} head=${head}"
            rm -f /tmp/body.out
            sleep 1
          done
          echo "A shape answering 200 with XML bytes is the one to use; packages/ted/src/client.ts ships with Bearer — if only 'raw' works, update the client before enabling the key."
