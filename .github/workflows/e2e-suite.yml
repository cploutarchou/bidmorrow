# The Playwright E2E suite as a reusable workflow. Two callers run this one
# job so they can never drift: e2e-nightly.yml (03:00 UTC schedule and
# manual dispatch) and e2e-pr.yml (every ready-for-review pull request,
# owner decision 2026-09-03 after the nightly went red on a copy change no
# pull request had run the suite against). Everything is local:
# scripts/e2e-webserver.sh (playwright.config.ts webServer) builds the SPA,
# writes .dev.vars, migrates + seeds local D1 and starts wrangler dev; no
# external network, no secrets.
name: E2E suite

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        # Version is resolved from the "packageManager" field in package.json — do not hardcode.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        # Avoids the ~120MB chromium download on every run. actions/cache
        # only saves on a green job, so a red run never poisons the cache.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm test:e2e
        env:
          CI: 'true'
          # Debug-level wrangler log FILE (uploaded below on failure). The
          # job log is unaffected: Playwright ignores the webServer's stdout.
          WRANGLER_LOG: debug

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload wrangler logs on failure
        # When workerd dies mid-suite the job log only shows an empty
        # `✘ [ERROR]` line from wrangler; the actual crash reason lives in the
        # wrangler log file it points at (2026-08-19..25 nightlies had every
        # test after the crash fail with ERR_CONNECTION_REFUSED and nothing
        # diagnosable in the job log).
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          retention-days: 7
          if-no-files-found: warn
