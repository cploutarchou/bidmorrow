# F-06: measure real staging API latency (p50/p95/p99) with the seeded
# perf-probe account. Manual dispatch + weekly. The script gates on the
# p95 budget given below and exits 1 on a breach.
#
# ADR-0012: staging answers with a Server-Timing header, so every route is
# reported as total (client wall clock), app (Worker-side wall clock) and
# net (the path between this runner and the Worker's colo), with the colo
# named. GitHub-hosted runners are not in Europe while D1 is (WEUR); the
# split is what makes a breach attributable. The customer-geography p95
# is read from Workers Logs (`request completed`, by colo), not from here.
name: staging-perf
on:
  workflow_dispatch: {}
  schedule:
    - cron: '45 5 * * 1'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    environment: staging
    # ~10 min at 8 routes x 40 iterations x 700 ms pacing; 20 is a hard stop,
    # not a budget (GitHub's default would let a hung probe run for 6 hours).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure staging API latency
        env:
          PERF_PASSWORD: ${{ secrets.STAGING_PERF_PASSWORD }}
        run: |
          node scripts/measure-api-latency.mjs \
            --base-url https://staging.bidmorrow.com \
            --email "${{ vars.STAGING_PERF_EMAIL }}" \
            --delay-ms 700 \
            --budget-ms 800
        # 500 ms is the LOCAL budget (a floor, per the script header). This
        # run crosses the public internet + Cloudflare edge from a GitHub
        # runner, so the gate is 800 ms on the client-side figure
        # (`--gate total`, the default). Baselines: 2026-08-30 feed routes
        # p95 595-640 ms; 2026-09-01 ~1,965 ms with no code change on those
        # paths. ADR-0012 §3 says which split outcome moves this gate to
        # `--gate app --budget-ms 500`; the budget is never loosened here.
