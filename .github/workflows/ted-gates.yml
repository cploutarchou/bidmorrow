# Pre-first-ingestion gates (docs/deployment.md, Phase 13): dispatchable
# live checks against the real TED Search API — checkQuerySyntax validation
# of the composed scope query (TED-P5-01) and the scoped notices/day volume
# measurement. Runs from GitHub runners because the development sandbox has
# no egress to api.ted.europa.eu. No secrets: the TED API is public and
# anonymous. Results are read from this workflow's log and recorded in
# docs/cost-model.md + IMPLEMENTATION_LEDGER.md.
name: TED live gates

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ted-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live TED gates
        run: TED_LIVE=1 pnpm exec vitest run tests/integration/ted-live-gate.test.ts
